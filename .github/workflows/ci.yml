name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gally-uring:ci .
      - run: docker compose config --quiet
      - name: Smoke-test the image
        run: |
          docker run -d --name gally-ci -p 127.0.0.1:8000:8000 gally-uring:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs gally-ci
          exit 1
      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag gally-uring:ci "$image:sha-${GITHUB_SHA::7}"
          docker push "$image:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            docker tag gally-uring:ci "$image:latest"
            docker push "$image:latest"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag gally-uring:ci "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          fi
