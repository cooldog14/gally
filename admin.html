<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
input, button { font: inherit; padding: 6px 10px; }
#error { color: #b91c1c; min-height: 1.2em; }
ul { list-style: none; padding: 0; }
li { padding: 6px 0; border-bottom: 1px solid #e5e5e5; }
li a { margin-right: 12px; }
li button { margin-left: 8px; }
#panel[hidden], [hidden] { display: none; }
#tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
#tools button, li button { cursor: pointer; }
#sweep-status, .meta { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>Admin</h1>
<div id="login">
  <input type="password" id="password" placeholder="Admin password" aria-label="Admin password" autocomplete="off">
  <button id="unlock" type="button">Unlock</button>
  <p id="error" role="alert"></p>
</div>
<div id="panel" hidden>
  <div id="tools">
    <button id="sweep" type="button">Clean orphaned files</button>
    <button id="logout" type="button">Log out</button>
    <span id="sweep-status" role="status"></span>
  </div>
  <h2>Galleries</h2>
  <ul id="galleries"></ul>
  <button id="load-more-galleries" type="button" hidden>Load more</button>
  <p id="panel-error" role="alert"></p>
</div>
<script>
"use strict";
const password = document.getElementById("password");
const unlockBtn = document.getElementById("unlock");
const errorEl = document.getElementById("error");
const panel = document.getElementById("panel");
const panelError = document.getElementById("panel-error");
const list = document.getElementById("galleries");
const moreBtn = document.getElementById("load-more-galleries");
const sweepStatus = document.getElementById("sweep-status");
let nextCursor = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { const e = await res.json(); if (e.error) msg = e.error; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

function formatBytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  let v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
  return (v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)) + " " + units[i];
}

function post(path) {
  return api(path, { method: "POST" });
}

async function load(reset = true) {
  if (reset) {
    panelError.textContent = "";
    list.textContent = "";
    nextCursor = null;
  }
  const url = "/api/admin/galleries?limit=200" + (nextCursor ? "&before=" + encodeURIComponent(nextCursor) : "");
  const data = await api(url);
  for (const g of data.galleries || []) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "/" + g.slug;
    a.textContent = g.slug;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent =
      " (" + g.photos + " photos, " + formatBytes(g.bytes) + (g.public ? ", public" : ", private") + ")";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Delete";
    remove.addEventListener("click", async () => {
      // One gallery goes; the uploader key keeps working.
      if (!confirm("Delete gallery " + g.slug + " and its files?")) return;
      try {
        await post("/api/admin/galleries/" + g.slug + "/remove");
        await load();
      } catch (e) { panelError.textContent = e.message; }
    });
    li.append(a, meta, remove);
    list.appendChild(li);
  }
  if (reset && !(data.galleries || []).length) {
    const li = document.createElement("li");
    li.className = "meta";
    li.textContent = "No galleries.";
    list.appendChild(li);
  }
  nextCursor = data.next || null;
  moreBtn.hidden = !nextCursor;
  moreBtn.disabled = false;
}

moreBtn.addEventListener("click", async () => {
  moreBtn.disabled = true;
  try {
    await load(false);
  } catch (e) {
    moreBtn.disabled = false;
    panelError.textContent = e.message;
  }
});

unlockBtn.addEventListener("click", async () => {
  errorEl.textContent = "";
  try {
    await api("/api/admin/unlock", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password.value }),
    });
  } catch (e) {
    errorEl.textContent = e.message;
    return;
  }
  document.getElementById("login").hidden = true;
  panel.hidden = false;
  try {
    await load();
  } catch (e) {
    panelError.textContent = e.message;
  }
});

document.getElementById("sweep").addEventListener("click", async () => {
  try {
    const r = await post("/api/admin/sweep");
    sweepStatus.textContent =
      "Removed " + r.deleted + " orphaned file(s)" +
      (r.failed ? ", " + r.failed + " failed" : "") +
      (r.galleries
        ? " and " + r.galleries + " empty " + (r.galleries === 1 ? "gallery" : "galleries")
        : "");
    await load();
  } catch (e) { panelError.textContent = e.message; }
});

const logoutBtn = document.getElementById("logout");
logoutBtn.addEventListener("click", async () => {
  if (logoutBtn.disabled) return;
  logoutBtn.disabled = true;
  panelError.textContent = "";
  try {
    const res = await fetch("/api/admin/logout", { method: "POST" });
    const data = await res.json();
    // A proxy's 403 is not proof that the server invalidated the session.
    if (!(res.ok && data?.ok === true) && !(res.status === 403 && data?.error === "admin session inactive")) {
      throw new Error();
    }
    panel.hidden = true;
    document.getElementById("login").hidden = false;
    password.value = "";
    password.focus();
  } catch (_) {
    panelError.textContent = "Could not confirm logout. Check your connection and try again.";
  } finally {
    logoutBtn.disabled = false;
  }
});
</script>
</body>
</html>
