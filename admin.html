<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
input, button { font: inherit; padding: 6px 10px; }
#error { color: #b91c1c; min-height: 1.2em; }
ul { list-style: none; padding: 0; }
li { padding: 6px 0; border-bottom: 1px solid #e5e5e5; }
li a { margin-right: 12px; }
li button { margin-left: 8px; }
#panel[hidden], [hidden] { display: none; }
#tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
#tools button, li button { cursor: pointer; }
#sweep-status, .meta { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>Admin</h1>
<div id="login">
  <input type="password" id="password" placeholder="Admin password" autocomplete="off">
  <button id="unlock" type="button">Unlock</button>
  <p id="error" role="alert"></p>
</div>
<div id="panel" hidden>
  <div id="tools">
    <button id="sweep" type="button">Clean orphaned files</button>
    <button id="logout" type="button">Log out</button>
    <span id="sweep-status" role="status"></span>
  </div>
  <h2>Galleries</h2>
  <ul id="galleries"></ul>
  <h2>Banned keys</h2>
  <ul id="banned"></ul>
  <div id="tools">
    <input id="unban-key" placeholder="Key to unban" autocomplete="off">
    <button id="unban" type="button">Unban</button>
    <span id="unban-status" role="status"></span>
  </div>
  <p id="panel-error" role="alert"></p>
</div>
<script>
"use strict";
const password = document.getElementById("password");
const unlockBtn = document.getElementById("unlock");
const errorEl = document.getElementById("error");
const panel = document.getElementById("panel");
const panelError = document.getElementById("panel-error");
const list = document.getElementById("galleries");
const bannedList = document.getElementById("banned");
const sweepStatus = document.getElementById("sweep-status");
const unbanStatus = document.getElementById("unban-status");

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { const e = await res.json(); if (e.error) msg = e.error; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

function formatBytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  let v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
  return (v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)) + " " + units[i];
}

function post(path) {
  return api(path, { method: "POST" });
}

async function load() {
  panelError.textContent = "";
  const data = await api("/api/admin/galleries");
  list.textContent = "";
  for (const g of data.galleries || []) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "/" + g.slug;
    a.textContent = g.slug;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent =
      " (" + g.photos + " photos, " + formatBytes(g.bytes) + (g.public ? ", public" : ", private") + ")";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Delete";
    remove.addEventListener("click", async () => {
      // One gallery goes; the uploader key keeps working.
      if (!confirm("Delete gallery " + g.slug + " and its files? The key is not banned.")) return;
      try {
        await post("/api/admin/galleries/" + g.slug + "/remove");
        await load();
      } catch (e) { panelError.textContent = e.message; }
    });
    const ban = document.createElement("button");
    ban.type = "button";
    ban.textContent = "Delete + ban";
    ban.addEventListener("click", async () => {
      // Every gallery of that key goes, and the key can never upload again.
      if (!confirm("Delete EVERY gallery of " + g.slug + "'s key and ban the key?")) return;
      try {
        const r = await post("/api/admin/galleries/" + g.slug + "/delete");
        await load();
        panelError.textContent = "Banned " + (r.slugs || []).length + " gallery/galleries, " + r.files + " files";
      } catch (e) { panelError.textContent = e.message; }
    });
    li.append(a, meta, remove, ban);
    list.appendChild(li);
  }
  if (!(data.galleries || []).length) {
    const li = document.createElement("li");
    li.className = "meta";
    li.textContent = "No galleries.";
    list.appendChild(li);
  }

  const bans = await api("/api/admin/banned");
  bannedList.textContent = "";
  for (const b of bans.banned || []) {
    const li = document.createElement("li");
    li.textContent = (b.label || "unknown gallery") + " — banned " + new Date(b.created * 1000).toLocaleString();
    bannedList.appendChild(li);
  }
  if (!(bans.banned || []).length) {
    const li = document.createElement("li");
    li.className = "meta";
    li.textContent = "No banned keys.";
    bannedList.appendChild(li);
  }
}

unlockBtn.addEventListener("click", async () => {
  errorEl.textContent = "";
  try {
    await api("/api/admin/unlock", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password.value }),
    });
    document.getElementById("login").hidden = true;
    panel.hidden = false;
    await load();
  } catch (e) { errorEl.textContent = e.message; }
});

document.getElementById("sweep").addEventListener("click", async () => {
  try {
    const r = await post("/api/admin/sweep");
    sweepStatus.textContent = "Removed " + r.deleted + " orphaned file(s)" + (r.failed ? ", " + r.failed + " failed" : "");
  } catch (e) { panelError.textContent = e.message; }
});

document.getElementById("unban").addEventListener("click", async () => {
  const key = document.getElementById("unban-key").value.trim();
  unbanStatus.textContent = "";
  if (!key) { unbanStatus.textContent = "Enter a key"; return; }
  try {
    await api("/api/admin/unban", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key }),
    });
    document.getElementById("unban-key").value = "";
    unbanStatus.textContent = "Unbanned";
    await load();
  } catch (e) { unbanStatus.textContent = e.message; }
});

document.getElementById("logout").addEventListener("click", async () => {
  try { await post("/api/admin/logout"); } catch (_) { /* already gone */ }
  panel.hidden = true;
  document.getElementById("login").hidden = false;
  password.value = "";
});
</script>
</body>
</html>
