<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<link rel="stylesheet" href="./styles.css">
<script>
try {
  var saved = localStorage.getItem("theme");
  document.documentElement.dataset.theme =
    saved === "light" || saved === "dark" ? saved :
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch (_) { document.documentElement.dataset.theme = "light"; }
</script>
</head>
<body>
<div id="key-banner" role="status" hidden>
  <span>Your key is <code id="key-banner-key"></code>. Note it down.</span>
  <button id="key-banner-copy" type="button">Copy key</button>
  <button id="key-banner-close" type="button" aria-label="Dismiss">&times;</button>
</div>
<header id="topbar">
  <button id="upload-btn" type="button">Upload</button>
  <input type="file" id="file-input" multiple hidden>
  <button id="edit-btn" type="button" hidden>Edit</button>
  <span id="gallery-label"></span>
  <span id="gallery-state" hidden></span>
  <div id="actions">
    <a id="home-link" href="./" hidden>Home</a>
    <button id="theme-btn" type="button" aria-label="Toggle theme">&#9789;</button>
  </div>
</header>
<div id="editbar" hidden>
  <span id="sel-count">0 selected</span>
  <button id="show-key-btn" type="button">Show key</button>
  <button id="share-btn" type="button" disabled>Share</button>
  <button id="delete-btn" type="button">Delete</button>
  <button id="delete-gallery-btn" type="button">Delete gallery</button>
  <button id="done-btn" type="button">Done</button>
</div>
<main id="main">
  <p id="upload-status" role="status"></p>
  <p id="empty" hidden>Empty gallery.</p>
  <div id="grid"></div>
  <button id="load-more" type="button" hidden>Load more</button>
</main>
<dialog id="key-dialog" aria-labelledby="key-title">
  <form method="dialog" id="key-form">
    <h2 id="key-title">Gallery key</h2>
    <input type="text" id="key-input" aria-labelledby="key-title" aria-describedby="key-help" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="128">
    <p id="key-help"></p>
    <p id="key-error" role="alert"></p>
    <div id="key-actions">
      <button id="key-cancel" value="cancel" type="button">Cancel</button>
      <button id="key-confirm" value="default" type="submit">Continue</button>
    </div>
  </form>
</dialog>
<dialog id="pass-dialog" aria-labelledby="pass-title">
  <form method="dialog" id="pass-form">
    <h2 id="pass-title">Locked gallery</h2>
    <p id="pass-help">This gallery is password-protected. Enter the gallery password to view it. The owner key always works too.</p>
    <input type="password" id="pass-input" aria-label="Gallery password" aria-describedby="pass-help" placeholder="Gallery password" autocomplete="off">
    <p id="pass-error" role="alert"></p>
    <div id="key-actions">
      <button id="pass-cancel" value="cancel" type="button">Cancel</button>
      <button id="pass-confirm" value="unlock" type="submit">Unlock</button>
    </div>
  </form>
</dialog>
<dialog id="share-dialog" aria-labelledby="share-title">
  <form method="dialog" id="share-form">
    <h2 id="share-title">Share gallery</h2>
    <label for="share-mode">Who can open this gallery?</label>
    <select id="share-mode">
      <option value="private">Private — only the owner</option>
      <option value="protected">Anyone with the link and password</option>
      <option value="public">Anyone with the link — no password</option>
    </select>
    <div id="share-password-field" hidden>
      <label for="share-password">Viewer password</label>
      <input type="password" id="share-password" autocomplete="new-password">
    </div>
    <p id="share-error" role="alert"></p>
    <div id="key-actions">
      <button id="share-cancel" type="button">Cancel</button>
      <button id="share-save" type="submit">Save</button>
    </div>
  </form>
</dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog" id="confirm-form">
    <h2 id="confirm-title">Delete photos?</h2>
    <p id="confirm-text">This cannot be undone.</p>
    <div id="key-actions">
      <button value="cancel" formnovalidate type="submit">Cancel</button>
      <button id="confirm-yes" value="default" type="submit">Delete</button>
    </div>
  </form>
</dialog>
<dialog id="lightbox" aria-label="Photo viewer">
  <button id="close" aria-label="Close">&times;</button>
  <button id="prev" aria-label="Previous">&lsaquo;</button>
  <div id="viewport"></div>
  <button id="next" aria-label="Next">&rsaquo;</button>
  <div id="counter"></div>
</dialog>
<script src="./app.js"></script>
</body>
</html>
