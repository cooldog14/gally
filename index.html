<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas</title>
<link rel="stylesheet" href="./styles.css">
<script>
try {
  var saved = localStorage.getItem("theme");
  document.documentElement.dataset.theme =
    saved === "light" || saved === "dark" ? saved :
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch (_) { document.documentElement.dataset.theme = "light"; }
</script>
</head>
<body>
<header id="topbar">
  <button id="upload-btn" type="button">Upload</button>
  <input type="file" id="file-input" multiple hidden>
  <span id="gallery-label"></span>
  <div id="actions">
    <button id="theme-btn" type="button" aria-label="Toggle theme">&#9789;</button>
  </div>
</header>
<main id="main">
  <p id="upload-status" role="status"></p>
  <div id="canvas-bar" hidden>
    <button id="canvas-mode" type="button" aria-pressed="false">Edit</button>
    <div id="canvas-tools" hidden>
      <button id="add-text" type="button">Text block</button>
      <select id="organize-by" aria-label="Organize order">
        <option value="date">by date</option>
        <option value="name">by name</option>
        <option value="kind">by kind</option>
      </select>
      <button id="organize" type="button">Organize</button>
      <button id="lock-btn" type="button">Protect</button>
    </div>
    <span id="canvas-status" role="status"></span>
    <div id="media-tray" aria-label="Uploaded media" hidden></div>
  </div>
  <p id="canvas-empty" hidden></p>
  <section id="canvas" hidden>
    <div id="canvas-surface"></div>
  </section>
</main>
<dialog id="key-dialog" aria-labelledby="key-title">
  <form method="dialog" id="key-form">
    <h2 id="key-title">Gallery key</h2>
    <input type="password" id="key-input" autocomplete="off" maxlength="128">
    <p id="key-error" role="alert"></p>
    <label id="private-row"><input type="checkbox" id="private-check"> Private gallery</label>
    <input type="password" id="key-pass-input" placeholder="Viewer password" autocomplete="new-password" hidden>
    <div id="key-actions">
      <button id="key-confirm" value="default" type="submit">Continue</button>
    </div>
  </form>
</dialog>
<dialog id="pass-dialog" aria-labelledby="pass-title">
  <form method="dialog" id="pass-form">
    <h2 id="pass-title">Locked gallery</h2>
    <p>This gallery is password-protected. Enter the gallery password to view it. The owner key always works too.</p>
    <input type="password" id="pass-input" placeholder="Gallery password" autocomplete="off">
    <p id="pass-error" role="alert"></p>
    <div id="key-actions">
      <button value="cancel" formnovalidate type="submit">Cancel</button>
      <button id="pass-confirm" value="default" type="submit">Unlock</button>
    </div>
  </form>
</dialog>
<dialog id="setpass-dialog" aria-labelledby="setpass-title">
  <form method="dialog" id="setpass-form">
    <h2 id="setpass-title">Protect gallery</h2>
    <p id="setpass-help">Viewers will need this password to open the gallery.</p>
    <input type="password" id="setpass-input" placeholder="New password" autocomplete="new-password">
    <p id="setpass-error" role="alert"></p>
    <div id="key-actions">
      <button value="cancel" formnovalidate type="submit">Cancel</button>
      <button id="setpass-remove" value="remove" formnovalidate type="submit" hidden>Remove protection</button>
      <button id="setpass-confirm" value="default" type="submit">Save</button>
    </div>
  </form>
</dialog>
<script src="./app.js"></script>
</body>
</html>
