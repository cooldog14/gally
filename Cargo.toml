[package]
name = "gally-uring"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
libc = "0.2"
axum = "0.8.9"
futures = "0.3.34"
hmac = "0.13"
image = "0.25"
ipnet = "2"
kamadak-exif = "0.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tempfile = "3.27.0"

[features]
# Live-server suite: spawns target/release/gally-uring. Off by default so a
# plain `cargo test` neither needs a release build nor runs it in debug.
stress = []

[[test]]
name = "stress"
required-features = ["stress"]
